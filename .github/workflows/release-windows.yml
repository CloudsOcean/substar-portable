name: Release Windows EXE

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    env:
      PYTHONUTF8: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements-release.txt
            requirements-test.txt
      - name: Resolve release tag
        shell: pwsh
        run: |
          $version = (Get-Content portable_manifest.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) { throw 'Tag and manifest version do not match.' }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prepare FFmpeg release binaries
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'substar-ffmpeg.zip'
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/octet-stream' }
          Invoke-WebRequest 'https://api.github.com/repos/CloudsOcean/substar-portable/releases/assets/799641285' -Headers $headers -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'c06c29bd660c4c4151c77b1eeb0775e4cee9aa5a3133cc427c0cff981b30e45d') { throw 'FFmpeg runtime checksum mismatch.' }
          Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $PWD 'runtime') -Force
      - name: Install release dependencies
        run: python -m pip install -r requirements-release.txt
      - name: Prepare transparent portable runtime
        shell: pwsh
        run: |
          $runtimePython = Join-Path $PWD 'runtime\python'
          $runtimeFfmpeg = Join-Path $PWD 'runtime\ffmpeg\bin'
          New-Item -ItemType Directory -Path $runtimePython, $runtimeFfmpeg -Force | Out-Null
          Copy-Item -Path (Join-Path $env:pythonLocation '*') -Destination $runtimePython -Recurse -Force
          foreach ($binary in @('ffmpeg.exe', 'ffprobe.exe')) {
            if (-not (Test-Path (Join-Path $runtimeFfmpeg $binary) -PathType Leaf)) { throw "Missing $binary" }
          }
          $runtimeFfmpeg | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Compile Python sources
        run: python -m compileall -q app.py launcher.py substar_core scripts
      - name: Run Python tests
        run: python -m pytest tests -q -p no:cacheprovider --basetemp "${{ runner.temp }}\pytest-ci"
      - name: Run Node tests
        env:
          SUBSTAR_TEST_PYTHON: python
        run: node --test tests\*.test.js tests\*.test.mjs
      - name: Build Substar Windows bundle
        shell: pwsh
        run: .\scripts\build-windows.ps1 -SkipTests
      - name: Create release archive
        shell: pwsh
        run: Compress-Archive -LiteralPath 'dist\Substar' -DestinationPath 'Substar-Windows-x64-${{ env.RELEASE_TAG }}.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Substar-Windows-x64-${{ env.RELEASE_TAG }}
          path: Substar-Windows-x64-${{ env.RELEASE_TAG }}.zip
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          overwrite_files: false
          generate_release_notes: true
          files: Substar-Windows-x64-${{ env.RELEASE_TAG }}.zip
