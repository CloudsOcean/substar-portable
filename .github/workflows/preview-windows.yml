name: Preview Windows EXE

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: substar-windows-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-2022
    env:
      PYTHONUTF8: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements-release.txt
            requirements-test.txt
      - name: Prepare FFmpeg release binaries
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-release-essentials.zip'
          $target = Join-Path $env:RUNNER_TEMP 'ffmpeg-release'
          Invoke-WebRequest 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $target -Force
          $ffmpeg = Get-ChildItem -LiteralPath $target -Recurse -File -Filter 'ffmpeg.exe' | Select-Object -First 1
          if (-not $ffmpeg) { throw 'Downloaded FFmpeg archive does not contain ffmpeg.exe.' }
          "SUBSTAR_FFMPEG_DIR=$($ffmpeg.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install release dependencies
        run: python -m pip install -r requirements-release.txt
      - name: Prepare transparent portable runtime
        shell: pwsh
        run: |
          $runtimePython = Join-Path $PWD 'runtime\python'
          $runtimeFfmpeg = Join-Path $PWD 'runtime\ffmpeg\bin'
          New-Item -ItemType Directory -Path $runtimePython, $runtimeFfmpeg -Force | Out-Null
          Copy-Item -Path (Join-Path $env:pythonLocation '*') -Destination $runtimePython -Recurse -Force
          foreach ($binary in @('ffmpeg.exe', 'ffprobe.exe')) {
            $source = Join-Path $env:SUBSTAR_FFMPEG_DIR $binary
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) { throw "Downloaded FFmpeg archive does not contain $binary." }
            Copy-Item -LiteralPath $source -Destination (Join-Path $runtimeFfmpeg $binary) -Force
          }
          $runtimeFfmpeg | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Compile Python sources
        run: python -m compileall -q app.py launcher.py substar_core scripts
      - name: Run Python tests
        run: python -m pytest tests -q -p no:cacheprovider --basetemp "${{ runner.temp }}\pytest-ci"
      - name: Run Node tests
        run: node --test tests\*.test.js
      - name: Build Substar Windows bundle
        shell: pwsh
        run: .\scripts\build-windows.ps1 -SkipTests
      - name: Create preview archive
        shell: pwsh
        run: Compress-Archive -LiteralPath 'dist\Substar' -DestinationPath 'Substar-Windows-x64-preview.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Substar-Windows-x64-preview-${{ github.sha }}
          path: Substar-Windows-x64-preview.zip
          if-no-files-found: error
          retention-days: 14
