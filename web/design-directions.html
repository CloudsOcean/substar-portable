function nav(){return `<aside class="app-nav"><div class="brand">${icon('star')}<span>Substar</span></div><div class="workspace"><div class="avatar">WS</div><span>我的工作空间</span>${icon('down')}</div>${Object.entries(names).map(([key,name])=>`<button class="nav-item" data-page="${key}" ${state.page===key?'aria-current="page"':''}>${icon(key)}<span>${name}</span>${key==='glossary'?'<span class="nav-count">'+state.terms.length+'</span>':''}</button>`).join('')}<div class="nav-label">RECENT PROJECTS</div><div class="nav-project"><span class="project-dot"></span>楚汉纪事 · 第三集</div><div class="nav-project"><span class="project-dot" style="background:#8986aa"></span>人物访谈 · 林间</div><div class="nav-bottom"><div class="profile"><div class="avatar">林</div><span>个人工作空间</span></div></div></aside>`}

function film(){return `<div class="film"><svg class="landscape" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#3f5143"/><stop offset="1" stop-color="#20362d"/></linearGradient><linearGradient id="river" x2="1" y2="0"><stop stop-color="#bcb88f" stop-opacity=".1"/><stop offset=".5" stop-color="#d6c694" stop-opacity=".5"/><stop offset="1" stop-color="#bcb88f" stop-opacity=".1"/></linearGradient></defs><path fill="url(#sky)" d="M0 0h800v500H0z"/><circle cx="621" cy="102" r="48" fill="#d4c79e" opacity=".55"/><path d="M0 280 109 166 171 199 291 97 414 228 520 152 638 278 741 175 800 220V500H0Z" fill="#657163" opacity=".6"/><path d="M0 305 160 246 211 277 349 192 470 322 588 231 715 328 800 273V500H0Z" fill="#304a3a"/><path d="M800 361C650 342 488 340 453 374S628 422 484 464L390 500H205C380 438 527 430 375 407S460 328 800 347Z" fill="url(#river)"/><path d="M0 350 139 328 256 401 118 415 0 389ZM800 410 711 390 627 443 800 480Z" fill="#20352b"/></svg><div class="film-meta"><span>SUBSTAR ORIGINAL</span><span>CHAPTER 03</span></div><h2 class="film-title">楚汉纪事<small>THE RIVER & THE EMPIRE</small></h2><div class="film-subtitle" id="filmSubtitle">${cues[state.cue][1]}</div></div><div class="transport"><span id="previewTime">${cues[state.cue][0]} / 08:11</span><div class="actions">${btn('','previous','quiet icon','back')}${btn('', 'play','quiet icon',state.playing?'pause':'play')}${btn('','next','quiet icon','next')}</div><span>16:9 · 1080p</span></div>`}
function wave(seed){return `<svg class="wave" viewBox="0 0 170 30" preserveAspectRatio="none" aria-hidden="true">${Array.from({length:52},(_,i)=>{let h=4+Math.abs(Math.sin(i*1.73+seed)*Math.cos(i*.34+seed))*25;return `<rect x="${i*3.3}" y="${(30-h)/2}" width="1.6" height="${h}" rx=".5" fill="currentColor"/>`}).join('')}</svg>`}
const time=n=>`${Math.floor(n/60).toString().padStart(2,'0')}:${Math.round(n%60).toString().padStart(2,'0')}`;
function editor(){return `${heading('楚汉纪事 · 黄河战局','中文 → 英文　 /　 208 条字幕　 /　 08:11','PROJECT / 03',btn('参考稿','reference','','file')+btn('导出字幕','export','primary','export'))}<div class="editor-grid"><section class="transcript"><div class="pane-toolbar"><div class="segmented"><button class="active" data-action="showTranslation">双语</button><button data-action="sourceOnly">原文</button></div><span class="muted">${icon('check')} 已匹配参考稿</span></div><div class="cue-list">${cues.map((c,i)=>`<button class="cue ${i===state.cue?'selected':''}" data-cue="${i}" aria-pressed="${i===state.cue}"><span class="cue-time">${c[0]}</span><span class="cue-text">${c[1].replace('荥阳','<span class="term-mark">荥阳</span>').replace('杨熊','<span class="term-mark">杨熊</span>')}<small>${c[2]}</small></span></button>`).join('')}</div></section><section class="preview">${film()}</section></div><section class="timeline"><div class="timeline-heading"><b>时间轴</b><span class="muted">${icon('settings')}　100%　 ·　 双语轨道</span></div><div class="ruler" id="ruler">${Array.from({length:7},(_,i)=>`<span>${time(state.offset+i*4)}</span>`).join('')}</div><div class="tracks">${cues.map((c,i)=>`<div class="clip ${i===state.cue?'active':''}"><small>${i+36}　${c[1]}</small>${wave(i)}</div>`).join('')}<div class="playhead" style="left:${(state.cue+.5)/6*100}%"></div></div><input id="scrubber" type="range" min="0" max="467" value="${state.offset}" aria-label="时间轴可视区域中心位置"></section><div class="editor-footer"><span>${icon('check')} 所有更改已保存于样稿</span><span>Space 播放　 ·　 Alt + 滚轮缩放　 ·　 Ctrl + Z 撤销</span></div>`}
function split(){return `${heading('项目','3 个最近项目 · 1 个处理中','WORKSPACE / CREATE',btn('启动教程','tutorial','','play'))}<div class="split-grid"><section class="panel"><h2>新建字幕项目</h2><div class="upload-zone"><div class="upload-icon">${icon('upload')}</div><h3 id="uploadTitle">把视频或音频放在这里</h3><p id="uploadMeta">MP4 · MOV · WAV · MP3</p>${btn('选择素材','chooseFile','','plus')}<input type="file" id="demoFile" accept="video/*,audio/*" hidden></div><div class="form-grid"><div class="field"><label for="sourceLanguage">原文语言</label><select id="sourceLanguage"><option>中文</option><option>英文</option><option>日文</option></select></div><div class="field"><label for="targetLanguage">译文语言</label><select id="targetLanguage"><option>英文</option><option>中文</option><option>日文</option></select></div></div><div class="reference-file">${icon('file')}<div>楚汉纪事_第三集.docx<small>参考稿 · 2,684 字</small></div>${btn('更换','reference','quiet')}</div><div class="form-grid"><div class="field"><label for="splitMode">切分方式</label><select id="splitMode"><option>按参考稿标点</option><option>智能语义切分</option></select></div><div class="field"><label for="asrModel">识别引擎</label><select id="asrModel"><option>Qwen 云端</option><option>本地识别</option></select></div></div><div class="panel-foot"><span>项目词库：楚汉纪事</span>${btn('创建项目','createProject','primary','plus')}</div></section><section class="panel pipeline-panel"><div class="pipeline-top"><h2 style="margin:0">正在处理</h2><span class="status-pill" id="jobState">1 个任务</span></div><div class="pipeline-steps"><div class="pipeline-step done"><span class="step-dot">✓</span><div><strong>导入素材</strong><small>人物访谈 · 林间.mp4</small></div></div><div class="pipeline-step done"><span class="step-dot">✓</span><div><strong>语音识别</strong><small>已识别 3,240 字 · 00:42</small></div></div><div class="pipeline-step current"><span class="step-dot">3</span><div><strong id="jobTitle">匹配参考稿</strong><small id="jobProgress">68% · 正在对齐句子</small><div class="mini-progress"><span id="progressFill"></span></div></div></div><div class="pipeline-step"><span class="step-dot">4</span><div><strong>切分与翻译</strong><small>等待上一阶段</small></div></div></div><div class="job-file">Qwen 云端 / 中文 → 英文<br>开始于 14:32 · 项目将在后台处理</div></section></div><div class="section-heading"><h2>最近项目</h2>${btn('查看全部','allProjects','quiet')}</div><div class="table-wrap"><table class="project-table"><thead><tr><th>项目</th><th>状态</th><th>时长</th><th>最近编辑</th><th></th></tr></thead><tbody>${[['楚汉纪事 · 黄河战局','汉','','08:11','今天 14:20'],['人物访谈 · 林间','林','blue','24:36','今天 12:08'],['城市漫游 · 杭州','杭','rust','06:42','昨天 18:40']].map((p,i)=>`<tr><td><div class="project-title"><span class="project-thumb ${p[2]}">${p[1]}</span><span>${p[0]}<small>中文 → 英文</small></span></div></td><td><span class="status-pill">${i===1?'处理中':'可编辑'}</span></td><td class="muted">${p[3]}</td><td class="muted">${p[4]}</td><td>${btn('打开','openProject','quiet','chevron')}</td></tr>`).join('')}</tbody></table></div>`}
function termRows(query=''){let terms=state.terms.map((t,i)=>({t,i})).filter(({t})=>(state.collection==='all'||t[2]===state.collection)&&t.join(' ').toLowerCase().includes(query.toLowerCase()));return terms.length?terms.map(({t,i})=>`<tr><td>${esc(t[0])}<small>${esc(t[3])}</small></td><td>${esc(t[1])}</td><td><span class="tag">${esc(t[2])}</span></td><td><button class="switch" role="switch" aria-label="启用 ${esc(t[0])}" aria-checked="${t[4]!==false}" data-term="${i}"></button></td></tr>`).join(''):'<tr><td colspan="4"><div class="empty-result">没有找到匹配的术语</div></td></tr>'}
function glossary(){return `${heading('词库',state.terms.length+' 个词条 · 中 → 英','LIBRARY / GLOSSARY',btn('导入','importTerms','','upload')+btn('新增术语','newTerm','primary','plus'))}<div class="glossary-layout"><aside class="collection-list"><button data-collection="all" class="${state.collection==='all'?'active':''}">${icon('glossary')}全部词条<span>${state.terms.length}</span></button><button data-collection="全局词库" class="${state.collection==='全局词库'?'active':''}">${icon('star')}全局词库<span>${state.terms.filter(t=>t[2]==='全局词库').length}</span></button><div class="collection-label">项目词库</div>${['楚汉纪事','人物访谈',...state.extraCollections].map(c=>`<button data-collection="${esc(c)}" class="${state.collection===c?'active':''}">${icon('file')}${esc(c)}<span>${state.terms.filter(t=>t[2]===c).length}</span></button>`).join('')}<button class="new-collection" data-action="newCollection">${icon('plus')}新建词库</button></aside><section><div class="table-toolbar"><label class="search-field">${icon('search')}<input id="termSearch" aria-label="搜索术语" placeholder="搜索原词或译文"></label><span class="muted" style="font-size:11px">原词　→　英文</span></div><div class="table-wrap"><table class="term-table"><thead><tr><th>原词</th><th>指定译文</th><th>所属词库</th><th>启用</th></tr></thead><tbody id="termRows">${termRows()}</tbody></table></div><div class="terms-foot"><span id="termCount">${state.terms.filter(t=>state.collection==='all'||t[2]===state.collection).length} 个词条</span><span>更改自动保存于样稿</span></div></section></div>`}
const promptText={
 '核心模板':'# Subtitle cue boundary planning\n\nYou are an editor of time-aligned subtitles.\nRead the complete word sequence before splitting.\n\n## Priorities\n\n1. Preserve every spoken word, in source order.\n2. Respect the character limit for each cue.\n3. Keep names and natural phrases together.\n4. Prefer a complete thought at each boundary.\n\n## Output\n\nReturn a sequence of cue boundaries.\nUse the supplied token IDs for each boundary.\nDo not rewrite or translate the source text.\n\n{{ word_sequence }}',
 '语言规则':'# 中文切分规则\n\n优先在完整语义单位之间设置边界。\n\n## 不拆开的内容\n\n- 人名、地名与机构名\n- 数字与单位\n- 词库中的固定术语\n\n## 边界判断\n\n结合上下文、停顿和句法选择自然的边界。\n避免留下孤立的语气词或连词。\n\n{{ language_policy }}',
 '构造案例':'# Boundary examples\n\nInput:\n刘邦顺势包围唐垒，准备解决荥阳秦军。\n\nPreferred:\n[刘邦顺势包围唐垒，]\n[准备解决荥阳秦军。]\n\nAvoid:\n[刘邦顺势包围唐垒，准备解决]\n[荥阳秦军。]\n\nKeep the action and its object together.'};
function promptKey(){return state.prompt+'|'+state.component}
function prompts(){let draft=state.promptDrafts[promptKey()]??promptText[state.component];return `${heading('提示词','7 组规则 · 中文','SETTINGS / PROMPTS','')}<div class="prompt-layout"><aside class="prompt-tree"><label class="search-field">${icon('search')}<input id="promptSearchDemo" placeholder="搜索提示词" aria-label="搜索提示词"></label><div class="tree-group">字幕切分</div>${['边界规划','块内修复','句界证据'].map(t=>`<button class="tree-item ${state.prompt===t?'active':''}" data-prompt="${t}">${t}<span>中文</span></button>`).join('')}<div class="tree-group">字幕翻译</div>${['字幕翻译','质量复核'].map(t=>`<button class="tree-item ${state.prompt===t?'active':''}" data-prompt="${t}">${t}<span>中 → 英</span></button>`).join('')}<div class="tree-group">编辑器 AI</div>${['听写校准','参考稿匹配'].map(t=>`<button class="tree-item ${state.prompt===t?'active':''}" data-prompt="${t}">${t}<span>通用</span></button>`).join('')}</aside><section><div class="prompt-workspace"><div class="prompt-titlebar"><div><h2>${state.prompt}</h2><small>字幕规则 / 中文</small></div><div class="actions">${btn('还原','resetPrompt','quiet')}${btn('保存','savePrompt','primary','check')}</div></div><div class="prompt-tabs">${Object.keys(promptText).map(t=>`<button class="${state.component===t?'active':''}" data-component="${t}">${t}</button>`).join('')}</div><div class="code-editor"><div class="line-numbers" aria-hidden="true">${Array.from({length:18},(_,i)=>i+1).join('\n')}</div><textarea id="promptEditorDemo" spellcheck="false" aria-label="提示词正文">${esc(draft)}</textarea></div><div class="prompt-footer"><span id="promptSaveState">${state.promptDirty?'有未保存的更改':'已保存于样稿'}</span><span id="charCount">${draft.length} 字符　 ·　 UTF-8</span></div></div><div class="prompt-hint">${icon('file')} segmentation / ${state.component==='核心模板'?'common':'zh'} / ${state.component==='构造案例'?'examples':'cue_grouping'}.md</div></section></div>`}
function render(){const url=new URL(location.href);url.searchParams.set('style',state.style);url.searchParams.set('page',state.page);url.searchParams.set('theme',state.theme);history.replaceState(null,'',url);let d=directions[state.style];$('#stage').dataset.style=state.style;$('#stage').dataset.theme=state.theme;document.querySelectorAll('[data-direction]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.direction===state.style));$('#directionNote').textContent=d.note;$('#referenceLink').textContent='设计参考：'+d.ref+' ↗';$('#referenceLink').href=d.url;$('#themeToggle').innerHTML=icon(state.theme==='dark'?'sun':'moon')+(state.theme==='dark'?'查看浅色':'查看深色');$('#app').innerHTML=`<div class="app-frame">${nav()}<section class="app-main"><header class="topbar"><div class="breadcrumbs">工作空间 ${icon('chevron')} <b>${names[state.page]}</b></div><div class="top-right"><span class="saved">本地演示</span><span class="key">⌘ K</span></div></header><div class="content">${({editor,split,glossary,prompts}[state.page])()}</div></section></div>`;bindPage()}
let toastTimer;
function toast(message){$('#toast').textContent=message;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,3500)}
function modal(kind){let collection=kind==='collection';$('#demoModal').innerHTML=`<form id="demoForm"><h2>${collection?'新建项目词库':'新增术语'}</h2><div class="field"><label for="newName">${collection?'词库名称':'原词'}</label><input id="newName" required maxlength="60" placeholder="${collection?'例如：城市漫游':'例如：鸿门宴'}"></div>${collection?'':`<div class="field"><label for="newTranslation">指定译文</label><input id="newTranslation" required maxlength="120" placeholder="Hongmen Banquet"></div>`}<div class="actions"><button class="btn" type="button" data-action="closeModal">取消</button><button class="btn primary" type="submit">创建</button></div></form>`;$('#demoModal').showModal();$('#demoForm').onsubmit=e=>{e.preventDefault();let name=$('#newName').value.trim();if(!name)return;if(collection){if(['楚汉纪事','人物访谈','全局词库',...state.extraCollections].includes(name)){toast('这个词库名称已存在');return}state.extraCollections.push(name);state.collection=name}else{const translation=$('#newTranslation').value.trim();if(!translation)return;state.terms.push([name,translation,state.collection==='all'?'楚汉纪事':state.collection,'术语'])}$('#demoModal').close();render();toast('已添加到演示数据')}}
function bindPage(){if($('#termSearch'))$('#termSearch').oninput=e=>{$('#termRows').innerHTML=termRows(e.target.value);$('#termCount').textContent=$('#termRows').querySelectorAll('.switch').length+' 个词条'};if($('#promptSearchDemo'))$('#promptSearchDemo').oninput=e=>document.querySelectorAll('.tree-item').forEach(b=>b.hidden=!b.textContent.includes(e.target.value));if($('#promptEditorDemo'))$('#promptEditorDemo').oninput=e=>{state.promptDrafts[promptKey()]=e.target.value;state.promptDirty=true;$('#promptSaveState').textContent='有未保存的更改';$('#charCount').textContent=e.target.value.length+' 字符　 ·　 UTF-8'};if($('#scrubber'))$('#scrubber').oninput=e=>{state.offset=Number(e.target.value);$('#ruler').innerHTML=Array.from({length:7},(_,i)=>`<span>${time(state.offset+i*4)}</span>`).join('');$('.tracks').style.transform=`translateX(${-state.offset%4*2}px)`};if($('#demoFile'))$('#demoFile').onchange=e=>{let f=e.target.files[0];if(f){$('#uploadTitle').textContent=f.name;$('#uploadMeta').textContent=(f.size/1024/1024).toFixed(1)+' MB · 仅在本页预览文件名';toast('已选择素材，文件不会上传')}}}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.direction){state.style=b.dataset.direction;state.theme=directions[state.style].theme;render();return}if(b.id==='themeToggle'){state.theme=state.theme==='light'?'dark':'light';render();return}if(b.dataset.page){state.page=b.dataset.page;render();return}if(b.dataset.cue!==undefined){state.cue=Number(b.dataset.cue);render();return}if(b.dataset.collection){state.collection=b.dataset.collection;render();return}if(b.dataset.term!==undefined){let t=state.terms[Number(b.dataset.term)];t[4]=t[4]===false;b.setAttribute('aria-checked',t[4]);return}if(b.dataset.prompt){state.prompt=b.dataset.prompt;render();return}if(b.dataset.component){state.component=b.dataset.component;render();return}const a=b.dataset.action;if(!a)return;if(a==='play'){state.playing=!state.playing;toast(state.playing?'静态主视觉演示：已切换播放状态':'已暂停演示');b.setAttribute('aria-label',state.playing?'暂停':'播放');b.innerHTML=icon(state.playing?'pause':'play');return}if(a==='next'||a==='previous'){state.cue=(state.cue+(a==='next'?1:5))%6;render();return}if(a==='sourceOnly'||a==='showTranslation'){document.querySelectorAll('.cue-text small').forEach(x=>x.hidden=a==='sourceOnly');document.querySelectorAll('.segmented button').forEach(x=>x.classList.toggle('active',x===b));return}if(a==='newCollection'||a==='newTerm'){modal(a==='newCollection'?'collection':'term');return}if(a==='closeModal'){$('#demoModal').close();return}if(a==='chooseFile'){$('#demoFile').click();return}if(a==='openProject'||a==='allProjects'){state.page='editor';render();return}if(a==='savePrompt'){state.promptDirty=false;$('#promptSaveState').textContent='已保存于样稿';toast('提示词已保留在本页样稿中');return}if(a==='resetPrompt'){delete state.promptDrafts[promptKey()];state.promptDirty=false;render();toast('已还原当前示例模板');return}if(a==='createProject'){$('#jobTitle').textContent='演示任务已完成';$('#jobProgress').textContent='100% · 208 条字幕';$('#progressFill').style.width='100%';$('#jobState').textContent='已完成';toast('流程演示完成，可打开下方项目体验编辑');return}if(a==='export'){let content=cues.map((c,i)=>`${i+1}\n00:${c[0]},000 --> 00:${i<5?cues[i+1][0]:'02:09'},000\n${c[1]}\n${c[2]}\n`).join('\n');const url=URL.createObjectURL(new Blob([content],{type:'text/plain;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download='Substar-设计样稿.srt';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出 6 条示例字幕');return}if(a==='reference'){toast('演示参考稿：楚汉纪事_第三集.docx · 2,684 字 · 已匹配');return}if(a==='importTerms'){toast('此处为词库导入入口；样稿支持点击“新增术语”体验编辑');return}if(a==='tutorial')toast('先选择素材与语言，再创建项目；下方可直接打开示例项目')});
const initial=new URLSearchParams(location.search);
if(directions[initial.get('style')]){state.style=initial.get('style');state.theme=directions[state.style].theme}
if(names[initial.get('page')])state.page=initial.get('page');
if(['light','dark'].includes(initial.get('theme')))state.theme=initial.get('theme');
render();
</script>
