<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/assets/substar-logo.svg?v=20260814-star-1" />
    <title>词库 · Substar</title>
    <link rel="stylesheet" href="/assets/glossary.css?v=20260828-project-library-3" />
    <link rel="stylesheet" href="/assets/shell.css?v=20260806-icons-1" />
    <link rel="stylesheet" href="/assets/theme/open-props-subset.css?v=20260814-1" />
    <link rel="stylesheet" href="/assets/theme/tokens.css?v=20260815-surface-opacity-1" />
    <script src="/assets/theme/personalization.js?v=20260815-surface-opacity-1"></script>
  </head>
  <body>
    <header class="app-header">
      <a class="brand" href="/split"
        ><svg class="ui-icon brand-mark" aria-hidden="true"><use href="/assets/ui-icons.svg?v=20260814-star-1#brand"></use></svg><span>Substar</span></a
      >
      <nav class="app-nav" aria-label="主导航">
        <a href="/split">切分</a><a href="/editor">编辑</a
        ><a class="active" href="/glossary">词库</a><a href="/settings">设置</a>
      </nav>
      <div id="saveState" class="header-state app-status">正在读取词库…</div>
    </header>
    <main class="glossary-layout asset-layout">
      <aside class="library-sidebar asset-sidebar">
        <div class="library-head asset-sidebar-heading with-action">
          <div>
            <h1>词库</h1>
          </div>
          <button
            id="addEntryTop"
            class="square-button"
            type="button"
            title="新增术语"
          >
            ＋
          </button>
        </div>
        <label class="search"
          ><span>⌕</span
          ><input id="searchInput" placeholder="搜索原词、译文或别名"
        /></label>
        <div class="filter-tabs asset-sidebar-list">
          <button class="active asset-sidebar-item" data-glossary="all" type="button">
            <span class="asset-sidebar-icon"><svg class="ui-icon"><use href="/assets/ui-icons.svg#glossary"></use></svg></span
            ><span class="asset-sidebar-copy"
              ><b>全部词条</b><small>所有作用域</small></span
            ><i class="asset-sidebar-meta" id="allCount">0</i></button
          ><button class="asset-sidebar-item" data-glossary="global" type="button">
            <span class="asset-sidebar-icon"><svg class="ui-icon"><use href="/assets/ui-icons.svg#search"></use></svg></span
            ><span class="asset-sidebar-copy"
              ><b>全局词库</b><small>用于所有项目</small></span
            ></button>
        </div>
        <div class="collection-heading"><span>项目词库</span></div>
        <div id="collectionList" class="collection-list asset-sidebar-list"></div>
        <button id="addCollection" class="collection-create" type="button">
          <span class="collection-create-icon">＋</span>
          <span><b>新建项目词库</b><small>按节目或客户分别管理</small></span>
        </button>
        <div class="library-summary">
          <div><strong id="enabledCount">0</strong><span>已启用</span></div>
          <div><strong id="projectCount">0</strong><span>项目词库</span></div>
        </div>
        <p class="library-note">
          ASR、翻译、切分与保守校准读取同一份项目词库；项目词优先于全局词。
        </p>
      </aside>

      <section class="glossary-content">
        <div class="content-heading">
          <div>
            <h2 id="contentTitle">全部术语</h2>
            <p>填写热词和指定译文；系统按项目语言方向使用对应关系。</p>
          </div>
          <div class="toolbar">
            <button id="importButton" class="secondary" type="button">
              导入</button
            ><input
              id="importFile"
              type="file"
              accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
              hidden
            />
            <details class="export-menu">
              <summary class="secondary">导出</summary>
              <div>
                <button data-export="xlsx" type="button">热词表（Excel）</button>
              </div>
            </details>
            <button id="addEntry" class="primary" type="button">
              ＋ 新增术语
            </button>
          </div>
        </div>
        <div id="emptyState" class="empty-state" hidden>
          <h3>还没有术语</h3>
          <p>添加常用人名、机构、品牌或容易误识别的词。</p>
          <button class="primary" type="button">新增第一条术语</button>
        </div>
        <div id="entryList" class="entry-list"></div>
        <div class="save-bar">
          <span id="formMessage">词库尚未修改</span
          ><button id="saveButton" class="primary" type="button">
            保存词库
          </button>
        </div>
      </section>
    </main>

    <template id="entryTemplate">
      <article class="entry-card">
        <div class="entry-main-row">
          <label class="enable-toggle" title="启用词条"
            ><input data-field="enabled" type="checkbox" checked /><span></span
          ></label>
          <div class="entry-title simple-entry-title">
            <input
              data-field="source"
              placeholder="热词／标准写法"
              maxlength="300"
            />
          </div>
          <select data-field="glossary_id" aria-label="保存到词库"></select>
          <button class="delete-entry" type="button" aria-label="删除术语">
            ⌫
          </button>
        </div>
        <div class="entry-target">
          <span>→</span
          ><input
            data-field="target"
            placeholder="指定译文（留空则只作为 ASR 热词）"
            maxlength="300"
          />
        </div>
      </article>
    </template>
    <dialog id="collectionDialog" class="collection-modal">
      <form method="dialog" class="collection-dialog-card">
        <div class="dialog-heading">
          <span class="dialog-icon"><svg class="ui-icon"><use href="/assets/ui-icons.svg#glossary"></use></svg></span>
          <div><h3>新建项目词库</h3><p>集中管理某个节目、客户或系列的固定译法。</p></div>
          <button class="dialog-close" value="cancel" type="submit" aria-label="关闭">×</button>
        </div>
        <label class="dialog-field"><span>词库名称</span><input id="collectionName" maxlength="100" placeholder="例如：科技访谈 · 第三季" autocomplete="off" /><small id="collectionNameError"></small></label>
        <div class="dialog-note"><svg class="ui-icon"><use href="/assets/ui-icons.svg#align"></use></svg><span>创建项目时可以直接选择；全局词库仍会同时生效。</span></div>
        <div class="dialog-actions"><button value="cancel" class="secondary">取消</button><button id="confirmCollection" value="default" class="primary">创建词库</button></div>
      </form>
    </dialog>
    <dialog id="deleteCollectionDialog" class="collection-modal danger-modal">
      <form method="dialog" class="collection-dialog-card">
        <div class="dialog-heading">
          <span class="dialog-icon danger"><svg class="ui-icon"><use href="/assets/ui-icons.svg#trash"></use></svg></span>
          <div><h3>删除项目词库？</h3><p id="deleteCollectionDescription"></p></div>
          <button class="dialog-close" value="cancel" type="submit" aria-label="关闭">×</button>
        </div>
        <div class="dialog-note danger-note">删除后，该词库中的术语也会移除。点击“保存词库”前可以刷新页面撤销。</div>
        <div class="dialog-actions"><button value="cancel" class="secondary">取消</button><button id="confirmDeleteCollection" value="default" class="danger-button">删除词库</button></div>
      </form>
    </dialog>
    <script src="/assets/system_save_as.js?v=20260826-system-save-as-1"></script>
    <script src="/assets/glossary.js?v=20260828-project-library-2"></script>
  </body>
</html>
