<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/assets/substar-logo.svg?v=20260814-star-1" />
    <title>词库 · Substar</title>
    <link rel="stylesheet" href="/assets/glossary.css?v=20260911-transfer-1" />
    <link rel="stylesheet" href="/assets/shell.css?v=20260909-unsaved-1" />
    <link rel="stylesheet" href="/assets/theme/open-props-subset.css?v=20260814-1" />
    <link rel="stylesheet" href="/assets/theme/tokens.css?v=20260908-nav-alignment-1" />
    <script src="/assets/theme/personalization.js?v=20260907-fixed-scale-1"></script>
  </head>
  <body>
    <header class="app-header">
      <a class="brand" href="/split"
        ><svg class="ui-icon brand-mark" aria-hidden="true"><use href="/assets/ui-icons.svg?v=20260814-star-1#brand"></use></svg><span>Substar</span></a
      >
      <nav class="app-nav" aria-label="主导航">
        <a href="/split">切分</a><a href="/editor">编辑</a
        ><a class="active" href="/glossary">词库</a><a href="/settings">设置</a>
      </nav>
      <div id="saveState" class="header-state app-status">正在读取词库…</div>
    </header>
    <main class="glossary-layout asset-layout">
      <aside class="library-sidebar asset-sidebar">
        <div class="library-head asset-sidebar-heading with-action">
          <div>
            <h1>词库</h1>
          </div>

        </div>
        <label class="search"
          ><span>⌕</span
          ><input id="searchInput" placeholder="搜索原词、译文或别名"
        /></label>
        <div class="filter-tabs asset-sidebar-list">
          <button class="active asset-sidebar-item" data-glossary="all" type="button">
            <span class="asset-sidebar-icon"><svg class="ui-icon"><use href="/assets/ui-icons.svg#glossary"></use></svg></span
            ><span class="asset-sidebar-copy"
              ><b>全部词条</b></span
            ><i class="asset-sidebar-meta" id="allCount">0</i></button
          >
        </div>
        <div class="collection-heading"><span>项目词库</span><span id="projectCount">0</span></div>
        <div id="collectionList" class="collection-list asset-sidebar-list"></div>
        <button id="addCollection" class="collection-create" type="button">
          <span class="collection-create-icon">＋</span>
          <span><b>新建项目词库</b></span>
        </button>

      </aside>

      <section class="glossary-content">
        <div class="content-heading">
          <div>
            <h2 id="contentTitle">全部词条</h2>

          </div>
          <div class="toolbar">
            <details id="injectionMenu" class="injection-menu">
              <summary class="secondary">注入管理</summary>
              <section id="glossaryPermissions" class="glossary-permissions" aria-label="项目词库注入管理"></section>
            </details>
            <details id="importMenu" class="export-menu">
              <summary class="secondary">导入</summary>
              <div>
                <button id="importButton" type="button">导入词库文件</button>
                <button id="copyExternalPrompt" type="button">提交外部模型生成</button>
                <button id="openImportEditor" type="button">打开填写界面</button>
              </div>
            </details>
            <input id="importFile" type="file" accept=".json,.xlsx" hidden />
            <button id="exportLibrary" class="secondary" type="button">导出</button>
            <button id="addEntry" class="primary" type="button">
              ＋ 新增术语
            </button>
          </div>
        </div>
        <details class="candidate-pool"><summary>候选池 <span id="candidateCount">0</span></summary>
          <div class="candidate-actions"><label><input id="candidateSelectAll" type="checkbox"> 全选</label><span id="candidateSelectedCount" aria-live="polite">已选 0</span><select id="candidateDestination" aria-label="候选词目标词库"></select><button id="approveCandidates" class="primary" type="button">加入词库</button><button id="ignoreCandidates" class="secondary" type="button">忽略</button></div>
          <div id="candidateList"></div><p id="candidateMessage"></p>
        </details>
        <div id="emptyState" class="empty-state" hidden>
          <h3>还没有术语</h3>
          <p>添加常用人名、机构、品牌或容易误识别的词。</p>
          <button class="primary" type="button">新增第一条术语</button>
        </div>
        <div id="entryList" class="entry-list"></div>
        <div class="save-bar">
          <span id="formMessage">词库尚未修改</span
          ><button id="saveButton" class="primary" type="button">
            保存词库
          </button>
        </div>
      </section>
    </main>

    <template id="entryTemplate">
      <article class="entry-card">
        <div class="entry-main-row">
          <label class="enable-toggle" title="启用词条"
            ><input data-field="enabled" type="checkbox" checked /><span></span
          ></label>
          <div class="entry-title simple-entry-title">
            <input
              data-field="source"
              placeholder="热词／标准写法"
              maxlength="300"
            />
          </div>
        <div class="entry-target">
          <input
            data-field="target"
            placeholder="可选译文"
            maxlength="300"
          />
        </div>
          <select data-field="glossary_id" aria-label="保存到词库"></select>
          <button class="delete-entry" type="button" aria-label="删除术语">
            ⌫
          </button>
        </div>

      </article>
    </template>
    <dialog id="collectionDialog" class="collection-modal">
      <form method="dialog" class="collection-dialog-card">
        <div class="dialog-heading">
          <span class="dialog-icon"><svg class="ui-icon"><use href="/assets/ui-icons.svg#glossary"></use></svg></span>
          <div><h3>新建项目词库</h3><p>集中管理某个节目、客户或系列的固定译法。</p></div>
          <button class="dialog-close" value="cancel" type="submit" aria-label="关闭">×</button>
        </div>
        <label class="dialog-field"><span>词库名称</span><input id="collectionName" maxlength="100" placeholder="例如：科技访谈 · 第三季" autocomplete="off" /><small id="collectionNameError"></small></label>
        <fieldset class="collection-permissions" id="collectionPermissions">
          <legend>注入权限</legend>
          <label><input type="checkbox" value="asr"> Qwen 听写</label>
          <label><input type="checkbox" value="calibration"> AI 校准</label>
          <label><input type="checkbox" value="translation"> 翻译</label>
        </fieldset>
        <div class="dialog-actions"><button value="cancel" class="secondary">取消</button><button id="confirmCollection" value="default" class="primary">创建词库</button></div>
      </form>
    </dialog>
    <dialog id="deleteCollectionDialog" class="collection-modal danger-modal">
      <form method="dialog" class="collection-dialog-card">
        <div class="dialog-heading">
          <span class="dialog-icon danger"><svg class="ui-icon"><use href="/assets/ui-icons.svg#trash"></use></svg></span>
          <div><h3>删除项目词库？</h3><p id="deleteCollectionDescription"></p></div>
          <button class="dialog-close" value="cancel" type="submit" aria-label="关闭">×</button>
        </div>
        <div class="dialog-note danger-note">删除后，该词库中的术语也会移除。点击“保存词库”前可以刷新页面撤销。</div>
        <div class="dialog-actions"><button value="cancel" class="secondary">取消</button><button id="confirmDeleteCollection" value="default" class="danger-button">删除词库</button></div>
      </form>
    </dialog>
    <dialog id="unsavedNavigationDialog" class="unsaved-navigation-dialog" aria-labelledby="unsavedNavigationTitle">
      <div class="unsaved-navigation-copy">
        <h2 id="unsavedNavigationTitle">保存当前修改？</h2>
        <p>尚未保存的修改会在离开后丢失。</p>
      </div>
      <div class="unsaved-navigation-actions">
        <button type="button" class="secondary" data-unsaved-navigation="stay">留在此页</button>
        <button type="button" class="secondary danger" data-unsaved-navigation="discard">放弃更改并前往</button>
        <button type="button" class="primary" data-unsaved-navigation="save">保存并前往</button>
      </div>
      <p id="unsavedNavigationStatus" class="unsaved-navigation-status" role="status"></p>
    </dialog>
    <dialog id="importEditor" class="transfer-dialog" aria-labelledby="importEditorTitle">
      <h2 id="importEditorTitle">填写词库</h2>
      <p>每行填写：热词；译文；项目词库。译文和项目可留空，也可粘贴外部模型生成的 JSON。</p>
      <textarea id="importText" aria-label="词库内容" placeholder="Cyrus Janssen；赛勒斯·詹森；WCICO"></textarea>
      <p id="importEditorError" role="status"></p>
      <div class="dialog-actions"><button class="secondary" data-close="importEditor">关闭</button><button id="previewText" class="primary">预览导入</button></div>
    </dialog>
    <dialog id="importPreview" class="transfer-dialog" aria-labelledby="importPreviewTitle">
      <h2 id="importPreviewTitle">导入预览</h2>
      <p id="importSummary"></p>
      <div id="importProjects"></div>
      <div id="importConflicts"></div>
      <p>增量合并，保留现有词条。应用后点击“保存词库”生效。</p>
      <div class="dialog-actions"><button class="secondary" data-close="importPreview">取消</button><button id="applyImport" class="primary">应用导入</button></div>
    </dialog>
    <script src="/assets/glossary_transfer.js?v=20260911-transfer-1"></script>
    <script src="/assets/system_save_as.js?v=20260826-system-save-as-1"></script>
    <script src="/assets/glossary.js?v=20260911-transfer-1"></script>
  </body>
</html>
